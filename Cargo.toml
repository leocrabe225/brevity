[package]
name = "brevity"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {version = "0.19.1", features = ["debug"]}
rand = "0.10"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Bevy systems trip these by design.
too_many_arguments = "allow"
type_complexity = "allow"
needless_pass_by_value = "allow" # Res, Query, etc. are passed by value
# picks from the restriction group.
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"
# I remove because they bother me without gains.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"